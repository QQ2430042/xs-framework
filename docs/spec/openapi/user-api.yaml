openapi: 3.1.0
info:
  title: User API
  description: Contract for tenant-scoped user management.
  version: 1.0.0
paths:
  /api/v1/users:
    post:
      tags: [User]
      operationId: createUser
      summary: Create a user
      description: Creates one user in the tenant resolved from the request context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request or missing tenant context
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/users/{userId}:
    get:
      tags: [User]
      operationId: getUser
      summary: Get a user by id
      description: Returns one user visible to the current tenant.
      parameters:
        - name: userId
          in: path
          required: true
          description: User identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request or missing tenant context
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
components:
  schemas:
    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          maxLength: 64
        displayName:
          type: string
          maxLength: 128
    UserView:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
        userCode:
          type: string
          pattern: '^UC[0-9A-F]{14}$'
        username:
          type: string
        displayName:
          type: string
    UserResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserView'
