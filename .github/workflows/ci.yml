name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: P0 gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Spectral CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: spectral-${{ runner.os }}-6.15.0

      - name: Show toolchain
        run: |
          java -version
          mvn -version
          node --version

      - name: Run all P0 gates
        run: bash scripts/ci/verify.sh

      - name: Upload gate evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            .tools/**/*.log
            .tools/dependency-tree/combined.txt
            .tools/openapi-drift/diff.txt
            **/target/surefire-reports/**
          if-no-files-found: ignore
