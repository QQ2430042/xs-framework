spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/xs_framework}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:xs_app}
    password: ${DB_PASSWORD:}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/pg

xs:
  tenant:
    rls-enabled: true
    allow-header: false
