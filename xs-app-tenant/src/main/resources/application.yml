spring:
  application:
    name: xs-tenant-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:xs_tenant;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/common

server:
  port: 18082

xs:
  tenant:
    rls-enabled: false
    allow-header: true
